<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAM AL KAHAF | Trade & Management Science Portal</title>
    <style>
        :root {
            /* Apple Pro Palette - Light Environment */
            --apple-bg: #f5f5f7;
            --apple-card: rgba(255, 255, 255, 0.75);
            --apple-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --apple-btn-bg: #0071e3;
            --apple-btn-text: #ffffff;
            --apple-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --blur-radius: 20px;
        }

        body.dark {
            /* Apple Pro Palette - Dark Environment */
            --apple-bg: #000000;
            --apple-card: rgba(22, 22, 23, 0.8);
            --apple-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-btn-bg: #f5f5f7;
            --apple-btn-text: #1d1d1f;
            --apple-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; 
            -webkit-font-smoothing: antialiased; 
        }

        body { 
            background: var(--apple-bg); 
            color: var(--text-primary); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: background 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        /* Top Utility Bar */
        .system-topbar { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 24px; 
            display: flex; 
            justify-content: flex-end; 
        }

        .icon-toggle { 
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 20px; 
            cursor: pointer; 
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }
        .icon-toggle:hover {
            opacity: 0.7;
        }

        /* Content Container */
        .main-portal-container { 
            width: 100%; 
            max-width: 640px; 
            margin: auto; 
            padding: 0 24px; 
        }

        .apple-glass-card { 
            background: var(--apple-card); 
            border: 1px solid var(--apple-border); 
            backdrop-filter: blur(var(--blur-radius)); 
            -webkit-backdrop-filter: blur(var(--blur-radius));
            box-shadow: var(--apple-shadow); 
            border-radius: 24px; 
            padding: 40px 32px; 
            text-align: center; 
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Monochromatic Identity Ring */
        .avatar-ring { 
            width: 72px; 
            height: 72px; 
            margin: 0 auto 24px; 
            border-radius: 50%; 
            border: 1px solid var(--text-primary);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            font-weight: 500; 
            letter-spacing: -0.02em;
        }

        .student-name { 
            font-size: 32px; 
            font-weight: 700; 
            letter-spacing: -0.03em; 
            margin-bottom: 4px; 
        }

        .student-id-tag { 
            font-size: 12px; 
            font-weight: 500; 
            letter-spacing: 0.02em; 
            color: var(--text-secondary); 
            margin-bottom: 24px; 
        }

        .divider-line { 
            width: 32px; 
            height: 1px; 
            background: var(--text-secondary); 
            opacity: 0.3;
            margin: 0 auto 24px; 
        }

        /* Interactive Action Launcher (Responsive Grid Layout) */
        .pipeline-launcher { 
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 440px; 
            margin: 0 auto; 
        }

        @media (min-width: 480px) {
            .pipeline-launcher {
                flex-direction: row;
                justify-content: center;
            }
        }

        .btn-apple { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            text-decoration: none; 
            padding: 14px 24px; 
            border-radius: 24px; 
            font-weight: 500; 
            font-size: 14px; 
            letter-spacing: -0.01em;
            flex: 1;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        .btn-apple-primary {
            background: var(--apple-btn-bg); 
            color: var(--apple-btn-text); 
        }

        .btn-apple-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
        }

        .btn-apple:hover { 
            opacity: 0.85;
            transform: scale(1.01);
        }
        .btn-apple:active {
            transform: scale(0.99);
        }

        /* Apple Clean Footer */
        .framework-footer { 
            width: 100%; 
            max-width: 800px; 
            margin: 40px auto 24px; 
            padding: 0 24px; 
            text-align: center; 
            font-size: 12px; 
            color: var(--text-secondary); 
            line-height: 1.5;
        }
        .framework-footer a { 
            color: var(--text-primary); 
            text-decoration: underline; 
        }
    </style>
    <script>
        /* Immediate execution directly inside head prevents white background flash on dark mode setups */
        if (localStorage.getItem('apple-premium-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark'));
        }
    </script>
</head>
<body>

    <header class="system-topbar">
        <button class="icon-toggle" onclick="toggleSystemTheme()" id="themeBtn" aria-label="Toggle Environment">🌓</button>
    </header>

    <main class="main-portal-container">
        <div class="apple-glass-card">
            <div class="avatar-ring">AK</div>
            <h1 class="student-name">ALAM AL KAHAF</h1>
            <p class="student-id-tag">Student Portfolio • ID: 24177375</p>
            
            <div class="divider-line"></div>
            
            <div class="pipeline-launcher">
                <!-- Connects directly to intro.html -->
                <a href="intro.html" class="btn-apple btn-apple-primary">
                    <span>Explore Projects</span>
                    <span>➔</span>
                </a>
                
                <!-- Connects directly to local vv.html resource nodes -->
                <a href="vv.html" class="btn-apple btn-apple-secondary">
                    <span>Course Resources</span>
                    <span>📂</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="framework-footer">
        <p>Portfolio Node Matrix &bull; Lead Developer: ALAM AL KAHAF &bull; <a href="https://docs.google.com/document/d/16d2q52FPrVg_NAe8F3OvEnjbI7PiTKm7riiz8aLLRAA/edit?usp=sharing" target="_blank">Syllabus Matrix Document ↗</a></p>
    </footer>

    <script>
        function toggleSystemTheme() {
            const turningDark = document.body.classList.toggle('dark');
            document.documentElement.classList.toggle('dark', turningDark);
            localStorage.setItem('apple-premium-theme', turningDark ? 'dark' : 'light');
        }
    </script>
</body>
</html>
